<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/cadastro-usuario.css') }}">
</head>

<body>

    <div class="container">

        <h1>Cadastrar Usuário</h1>

        <!-- Mensagens Flash -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <!-- FORMULÁRIO -->
        <form action="{{ url_for('usuario.cadastro_post') }}" method="POST" id="form-cadastro">

            <label>Nome:</label>
            <input type="text" name="nome" placeholder="Nome completo" required>

            <label>CPF:</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" maxlength="14" required>
            <span id="erro-cpf" class="erro-validacao"></span>

            <label>Email:</label>
            <input type="email" name="email" placeholder="seu@email.com" required>

            <label>Idade:</label>
            <input type="number" name="idade" placeholder="Sua idade" min="1" max="120" required>

            <label>Senha:</label>
            <input type="password" name="senha" placeholder="Mínimo 6 caracteres" minlength="6" required>

            <label>Perfil:</label>
            <input type="text" name="perfil" placeholder="user" required>

            <button type="submit">Cadastrar</button>

        </form>

        <p>
            Já tem conta?
            <a href="{{ url_for('usuario.login_get') }}">Fazer login</a>
        </p>

    </div>

<script src="{{ url_for('static', filename='js/cadastro.js') }}"></script>
</body>

</html>
